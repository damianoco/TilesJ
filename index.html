<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tile Sums Junior</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7e0;--card:#fff;--ink:#2b2b3a;--line:#d9c7a0;--t:clamp(96px,27vw,140px);--th:calc(var(--t)*1.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2033;--card:#2a2e48;--ink:#f4f1ff;--line:#55597a}}
:root[data-theme="dark"]{--bg:#1d2033;--card:#2a2e48;--ink:#f4f1ff;--line:#55597a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;text-align:center;padding:12px;-webkit-user-select:none;user-select:none}
h1{font-size:clamp(20px,5vw,28px);margin:4px 0 8px}
.target{display:inline-flex;align-items:center;gap:14px;background:var(--card);border:4px solid #ff8a3d;border-radius:24px;padding:10px 20px}
.target .n{font-size:clamp(56px,16vw,90px);font-weight:900;color:#ff8a3d;line-height:1}
.mini{display:grid;grid-template-columns:repeat(5,18px);gap:5px}
.mini i{width:18px;height:18px;border-radius:50%;background:#ff8a3d}
.lbl{font-size:clamp(18px,4.5vw,24px);margin:10px 0 4px;font-weight:700}
.tray{min-height:calc(var(--th) + 20px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;background:var(--card);border:3px dashed var(--line);border-radius:24px;padding:10px;margin:0 auto;max-width:760px}
.op{font-size:clamp(36px,10vw,56px);font-weight:900}
.total{font-size:clamp(48px,14vw,80px);font-weight:900;min-width:1.2em}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:10px auto;max-width:760px}
.slot{width:var(--t);height:var(--th);border-radius:22px;border:3px dashed var(--line)}
.tile{width:var(--t);height:var(--th);border-radius:22px;border:none;color:#fff;position:relative;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-family:inherit;touch-action:manipulation}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tile .num{font-size:calc(var(--t)*.3);font-weight:900;line-height:1}.row{display:flex;align-items:center;justify-content:space-around;width:100%}.row svg{width:calc(var(--t)*.36);height:calc(var(--t)*.36)}
.dice{width:62%;aspect-ratio:1;background:#fff;border-radius:14px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9%;gap:2%}
.dice i{border-radius:50%;margin:12%}
.dice i.on{background:currentColor}
.hint{outline:6px solid #ffd700;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
button.big{font-family:inherit;font-size:clamp(18px,5vw,26px);font-weight:800;border:none;border-radius:18px;padding:12px 22px;margin:6px;cursor:pointer;color:#fff;background:#3a86ff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
button.big.alt{background:#8a5cf6}
.msg{min-height:86px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;justify-items:center;gap:4px 8px;max-width:760px;margin:0 auto;font-size:clamp(18px,5vw,24px);font-weight:700}.nl{grid-column:1;grid-row:1}.nr{grid-column:3;grid-row:1}#msg{grid-column:2;grid-row:1}
.tally{font-size:clamp(26px,7vw,40px);line-height:1.3;min-height:1.3em;word-break:break-all}
.hands{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;min-height:calc(var(--t)*.8);margin:6px 0}.hands svg{width:calc(var(--t)*.8);height:calc(var(--t)*.8)}.hands .nose{font-size:calc(var(--t)*.6)}.tray.ok{border-color:#2fbf71;border-style:solid}
.cel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);font-size:clamp(48px,14vw,90px);display:none;z-index:9;pointer-events:none}#cl{left:8px}#cr{right:8px}button.big.nx{display:none;margin:0;background:#2fbf71;font-size:clamp(24px,5.5vw,34px);padding:16px 28px}.cf{position:fixed;top:-60px;font-size:30px;z-index:8;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}body.won .cel{animation:pop .5s infinite alternate}@keyframes pop{to{transform:scale(1.25) rotate(12deg)}}body.won .cel,body.won button.big.nx{display:block}
@media (max-width:600px){
:root{--t:calc((100vw - 52px)/4)}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{padding:6px}
h1{font-size:20px;margin:2px 0 6px}
.target{padding:6px 14px;gap:10px;border-width:3px}
.mini{grid-template-columns:repeat(5,14px);gap:4px}.mini i{width:14px;height:14px}
.lbl{font-size:17px;margin:6px 0 2px}
.tray{padding:6px;gap:4px;border-width:2px}
.op{font-size:30px}.total{font-size:44px}
.bank{gap:8px;margin:8px 0}
.tile{padding:4px;border-radius:16px}.slot{border-radius:16px}
.hands{gap:2px;min-height:calc(var(--t)*.8);margin:2px 0}.hands .nose{line-height:1}
.msg{font-size:17px;min-height:64px}
button.big{font-size:18px;padding:8px 16px;margin:4px}
.cel{font-size:44px}
button.big.nx{font-size:20px;padding:12px 14px;margin:0}
}
</style></head><body>
<h1>Make the number!</h1>
<div class="target"><div class="n" id="tn"></div><div class="mini" id="td"></div></div>
<div class="lbl">Tap two tiles to add them up</div>
<div class="tray" id="tray"></div>
<div class="hands" id="hands"></div>
<div class="msg"><button class="big nx nl">Next ➡️</button><span id="msg"></span><button class="big nx nr">Next ➡️</button></div>
<div class="bank" id="bank"></div>
<button class="big alt" id="help">Help me 💡</button>
<div class="tally" id="tally"></div>
<span class="cel" id="cl">🎉</span><span class="cel" id="cr">🎉</span><script>
var COL=["#e63946","#f77f00","#2fbf71","#3a86ff","#8a5cf6"];
var POS=[[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8]];
var tiles=[],target=0,sol=[],tally="",done=false,hinting=false;
var $=function(i){return document.getElementById(i)};
function dice(v){var h='<div class="dice" style="color:'+COL[v-1]+'">';for(var k=0;k<9;k++)h+='<i'+(POS[v-1].indexOf(k)>-1?' class="on"':'')+'></i>';return h+'</div>'}
function hand(n){var F=[[14,8],[24.5,4],[35,8],[45.5,14]],s='<svg viewBox="0 0 64 64"><g fill="#ffcf9f" stroke="#c98a5a" stroke-width="1.5">';
for(var i=0;i<4;i++){var f=F[i];s+=i<n?'<rect x="'+f[0]+'" y="'+f[1]+'" width="9" height="'+(38-f[1])+'" rx="4.5"/>':'<circle cx="'+(f[0]+4.5)+'" cy="30" r="5"/>'}
s+=n>4?'<rect x="5" y="22" width="9" height="26" rx="4.5" transform="rotate(-30 10 35)"/>':'<circle cx="13" cy="44" r="5"/>';
return s+'<rect x="14" y="30" width="40" height="28" rx="12"/></g></svg>'}
function hands(n){if(n<1)return '';if(n<=5)return hand(n);if(n==6)return hand(5)+'<span class="nose">👃</span>';return hand(5)+hand(n-5)}
function tileHTML(t,cls){return '<button class="tile '+(cls||'')+'" data-id="'+t.id+'" style="background:'+COL[t.v-1]+'">'+dice(t.v)+'<div class="row"><span class="num">'+t.v+'</span>'+hand(t.v)+'</div></button>'}
function confetti(){var d=document.createElement("div"),E=["🎉","⭐","🎈","✨","🌟","🎊"];d.id="conf";
for(var i=0;i<36;i++){var c=document.createElement("span");c.className="cf";c.textContent=E[i%6];c.style.left=Math.random()*94+"vw";c.style.animationDuration=(2+Math.random()*2.5)+"s";c.style.animationDelay=(Math.random()*1)+"s";d.appendChild(c)}
document.body.appendChild(d);setTimeout(function(){d.remove()},5500)}
function newGame(){
  done=false;hinting=false;document.body.classList.remove("won");var cc=$("conf");if(cc)cc.remove();$("msg").textContent="";
  tiles=[];for(var i=0;i<4;i++)tiles.push({id:i,v:1+Math.floor(Math.random()*5),used:false,ord:0});
  var ids=[0,1,2,3].sort(function(){return Math.random()-.5}),n=2;
  sol=ids.slice(0,n);target=0;sol.forEach(function(i){target+=tiles[i].v});
  var md='';for(var k=0;k<target;k++)md+='<i></i>';
  $("tn").textContent=target;$("td").innerHTML=md;render();
}
function render(){
  var used=tiles.filter(function(t){return t.used}).sort(function(a,b){return a.ord-b.ord}),sum=0,h='';
  used.forEach(function(t,i){sum+=t.v;h+=(i?'<span class="op">+</span>':'')+tileHTML(t)});
  if(used.length)h+='<span class="op">=</span><span class="total">'+sum+'</span>';
  else h='<span class="op" style="opacity:.4">?</span>';
  $("tray").className="tray";$("tray").innerHTML=h;$("hands").innerHTML=hands(sum);
  var b='';tiles.forEach(function(t){b+=t.used?'<div class="slot"></div>':tileHTML(t,hinting&&sol.indexOf(t.id)>-1?'hint':'')});
  $("bank").innerHTML=b;
  return sum;
}
function renderAnim(){var old={};
document.querySelectorAll(".tile").forEach(function(b){old[b.getAttribute("data-id")]=b.getBoundingClientRect()});
var sum=render();
document.querySelectorAll(".tile").forEach(function(b){var o=old[b.getAttribute("data-id")];if(!o)return;
var n=b.getBoundingClientRect(),dx=o.left-n.left,dy=o.top-n.top;if(!dx&&!dy)return;
b.style.transition="none";b.style.transform="translate("+dx+"px,"+dy+"px)";b.style.zIndex=5;b.getBoundingClientRect();
b.style.transition="transform .4s ease";b.style.transform="";
setTimeout(function(){b.style.transition="";b.style.zIndex=""},450)});
return sum}
var seq=0;
function tap(e){
  if(done)return;var el=e.target.closest(".tile");if(!el)return;
  var t=tiles[+el.getAttribute("data-id")];
  if(!t.used&&tiles.filter(function(x){return x.used}).length>=2){$("msg").textContent="Only two tiles! Tap one to take it off.";$("tray").classList.add("shake");setTimeout(function(){$("tray").classList.remove("shake")},450);return}
  t.used=!t.used;if(t.used)t.ord=++seq;
  var sum=renderAnim(),cnt=tiles.filter(function(x){return x.used}).length;
  if(sum===target&&cnt===2){done=true;tally+="😊";$("tally").textContent=tally;$("tray").classList.add("ok");$("msg").textContent="You did it! 🌟";document.body.classList.add("won");confetti()}
  else if(sum>target){$("msg").textContent="Too many! Tap a tile to take it off.";$("tray").classList.add("shake");setTimeout(function(){$("tray").classList.remove("shake")},450)}
  else $("msg").textContent="";
}
$("bank").addEventListener("click",tap);$("tray").addEventListener("click",tap);
document.querySelectorAll(".nx").forEach(function(b){b.addEventListener("click",newGame)});
$("help").addEventListener("click",function(){
  if(done)return;tiles.forEach(function(t){t.used=false});hinting=true;tally+="🤪";$("tally").textContent=tally;$("msg").textContent="Try the glowing tiles!";renderAnim();
});
newGame();
</script></body></html>
